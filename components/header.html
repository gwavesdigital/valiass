    <div class="header-inner">

        <!-- BRAND -->

            <span class="valiass-logo">V</span>
            <span class="valiass-name">VALIASS</span>
        </a>

        <!-- NAVIGATION -->
        <nav class="valiass-nav">

            <a href="index.html" data-page="index.html">
                Home
            </a>

            <a href="story.html" data-page="story.html">
                Story
            </a>

            <a href="family.html" data-page="family.html">
                Family

            <a href="roots.html" data-page="roots.html">
                Roots
            </a>

            <a href="branches.html" data-page="branches.html">
                Branches

            <a href="vision.html" data-page="vision.html">
                Vision
            </a>

            <a href="contact.html" data-page="contact.html">
                Contact
            </a>

        </nav>

    </div>
</header>

<style>
/* =========================================
   VALIASS MASTER HEADER
   ========================================= */

.valiass-header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:78px;
    z-index:9999;

    background:rgba(16,23,17,0.92);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    border-bottom:1px solid rgba(208,180,107,0.16);
}

.header-inner{
    width:min(1400px,92%);
    height:100%;
    margin:0 auto;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

/* =========================================
   BRAND — LEFT SIDE
   ========================================= */

.valiass-brand{
    display:flex;
    align-items:center;
    gap:13px;

    text-decoration:none;
    color:#f4efe4;

    flex-shrink:0;
}

.valiass-logo{
    width:38px;
    height:38px;

    border:1px solid rgba(208,180,107,0.75);
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#d0b46b;

    font-family:Georgia, "Times New Roman", serif;
    font-size:18px;

    transition:all .3s ease;
}

.valiass-name{
    font-family:Georgia, "Times New Roman", serif;

    font-size:20px;
    letter-spacing:5px;

    color:#f4efe4;

    line-height:1;
}

/* =========================================
   NAVIGATION
   ========================================= */

.valiass-nav{
    display:flex;
    align-items:center;
    gap:30px;
}

.valiass-nav a{
    position:relative;

    text-decoration:none;

    color:rgba(244,239,228,0.68);

    font-family:Arial, Helvetica, sans-serif;
    font-size:12px;

    letter-spacing:1.5px;
    text-transform:uppercase;

    padding:31px 0 27px;

    transition:
        color .3s ease,
        opacity .3s ease;
}

.valiass-nav a::after{
    content:"";

    position:absolute;
    left:0;
    bottom:20px;

    width:0;
    height:1px;

    background:#d0b46b;

    transition:width .3s ease;
}

.valiass-nav a:hover{
    color:#f4efe4;
}

.valiass-nav a:hover::after{
    width:100%;
}

/* ACTIVE PAGE */

.valiass-nav a.active{
    color:#d0b46b;
}

.valiass-nav a.active::after{
    width:100%;
}

/* =========================================
   RESPONSIVE
   ========================================= */

@media(max-width:900px){

    .header-inner{
        width:94%;
    }

    .valiass-nav{
        gap:18px;
        overflow-x:auto;
        scrollbar-width:none;
    }

    .valiass-nav::-webkit-scrollbar{
        display:none;
    }

    .valiass-nav a{
        white-space:nowrap;
        font-size:10px;
        letter-spacing:1.2px;
    }

}

@media(max-width:650px){

    .valiass-header{
        height:70px;
    }

    .header-inner{
        gap:18px;
    }

    .valiass-name{
        font-size:17px;
        letter-spacing:4px;
    }

    .valiass-logo{
        width:34px;
        height:34px;
        font-size:16px;
    }

    .valiass-nav{
        gap:16px;
    }

    .valiass-nav a{
        padding:27px 0 23px;
        font-size:9px;
    }

    .valiass-nav a::after{
        bottom:16px;
    }
}
</style>

<script>
(function(){

    let currentPage =
        window.location.pathname
        .split("/")
        .pop()
        .toLowerCase();

    if(currentPage === "" || currentPage === "/"){
        currentPage = "index.html";
    }

    const links =
        document.querySelectorAll(
            ".valiass-nav a[data-page]"
        );

    links.forEach(function(link){

        const page =
            link.getAttribute("data-page")
            .toLowerCase();

        if(page === currentPage){
            link.classList.add("active");
        }

    });

})();
</script>
