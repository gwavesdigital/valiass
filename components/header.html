<script>

/* =========================================================
   VALIASS MASTER HEADER SCRIPT
   ========================================================= */

(function(){

    const currentPath =
        window.location.pathname
        .toLowerCase()
        .replace(/\\/g,"/");


    /* =====================================================
       NORMAL NAVIGATION
       ===================================================== */

    const navLinks =
        document.querySelectorAll(
            ".valiass-nav > a[data-page]"
        );


    navLinks.forEach(
        function(link){

            const page =
                link
                .getAttribute("data-page")
                .toLowerCase();


            const currentFile =
                currentPath
                .split("/")
                .pop();


            /* HOME */

            if(
                (
                    currentFile === "" ||
                    currentFile === "index.html"
                ) &&
                page === "index.html"
            ){

                if(
                    !currentPath.includes(
                        "/branches/"
                    )
                ){

                    link.classList.add(
                        "active"
                    );

                }

            }


            /* OTHER MAIN PAGES */

            else if(
                currentFile === page
            ){

                link.classList.add(
                    "active"
                );

            }

        }
    );


    /* =====================================================
       BRANCHES ACTIVE STATE
       ===================================================== */

    const branchesMenu =
        document.querySelector(
            ".branches-menu"
        );


    const branchesTrigger =
        document.querySelector(
            ".nav-dropdown-trigger"
        );


    const branchLinks =
        document.querySelectorAll(
            "[data-branch-page]"
        );


    let insideBranches = false;


    /* BRANCHES OVERVIEW */

    if(
        currentPath.endsWith(
            "/branches.html"
        )
    ){

        insideBranches = true;

    }


    /* ANY BRANCH PAGE */

    if(
        currentPath.includes(
            "/branches/"
        )
    ){

        insideBranches = true;

    }


    if(insideBranches){

        branchesTrigger.classList.add(
            "active"
        );

    }


    /* =====================================================
       ACTIVE BRANCH ITEM
       ===================================================== */

    branchLinks.forEach(
        function(link){

            const branchPage =
                link
                .getAttribute(
                    "data-branch-page"
                )
                .toLowerCase();


            if(
                currentPath.endsWith(
                    branchPage
                )
            ){

                link.classList.add(
                    "active"
                );

            }

        }
    );


    /* =====================================================
       MOBILE TOGGLE
       ===================================================== */

    branchesTrigger.addEventListener(
        "click",
        function(event){

            if(
                window.innerWidth <= 800
            ){

                event.preventDefault();


                const isOpen =
                    branchesMenu.classList.contains(
                        "open"
                    );


                branchesMenu.classList.toggle(
                    "open",
                    !isOpen
                );


                branchesTrigger.setAttribute(
                    "aria-expanded",
                    String(!isOpen)
                );

            }

        }
    );


    /* =====================================================
       CLOSE MOBILE DROPDOWN
       ===================================================== */

    document.addEventListener(
        "click",
        function(event){

            if(
                window.innerWidth <= 800 &&
                !branchesMenu.contains(
                    event.target
                )
            ){

                branchesMenu.classList.remove(
                    "open"
                );


                branchesTrigger.setAttribute(
                    "aria-expanded",
                    "false"
                );

            }

        }
    );


})();

</script>
