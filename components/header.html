<script>

/* =========================================================
   VALIASS MASTER HEADER SCRIPT
   ========================================================= */

(function(){

    const currentPath =
        window.location.pathname
        .toLowerCase()
        .replace(/\\/g,"/");


    /* =====================================================
       NORMAL NAVIGATION
       ===================================================== */

    const navLinks =
        document.querySelectorAll(
            ".valiass-nav > a[data-page]"
        );


    navLinks.forEach(
        function(link){

            const page =
                link
                .getAttribute("data-page")
                .toLowerCase();


            const currentFile =
                currentPath
                .split("/")
                .pop();


            /* HOME */

            if(
                (
                    currentFile === "" ||
                    currentFile === "index.html"
                ) &&
                page === "index.html"
            ){

                if(
                    !currentPath.includes(
                        "/branches/"
                    )
                ){

                    link.classList.add(
                        "active"
                    );

                }

            }


            /* OTHER MAIN PAGES */

            else if(
                currentFile === page
            ){

                link.classList.add(
                    "active"
                );

            }

        }
    );


    /* =====================================================
       BRANCHES ACTIVE STATE
       ===================================================== */

    const branchesMenu =
        document.querySelector(
            ".branches-menu"
        );


    const branchesTrigger =
        document.querySelector(
            ".nav-dropdown-trigger"
        );


    const branchLinks =
        document.querySelectorAll(
            "[data-branch-page]"
        );


    let insideBranches = false;


    /* BRANCHES OVERVIEW */

    if(
        currentPath.endsWith(
            "/branches.html"
        )
    ){

        insideBranches = true;

    }


    /* ANY BRANCH PAGE */

    if(
        currentPath.includes(
            "/branches/"
        )
    ){

        insideBranches = true;

    }


    if(insideBranches){

        branchesTrigger.classList.add(
            "active"
        );

    }


    /* =====================================================
       ACTIVE BRANCH ITEM
       ===================================================== */

    branchLinks.forEach(
        function(link){

            const branchPage =
                link
                .getAttribute(
                    "data-branch-page"
                )
                .toLowerCase();


            if(
                currentPath.endsWith(
                    branchPage
                )
            ){

                link.classList.add(
                    "active"
                );

            }

        }
    );


    /* =====================================================
       MOBILE MENU ELEMENTS
       ===================================================== */

    const mobileMenuButton =
        document.querySelector(
            ".mobile-menu-button"
        );


    const mobileNav =
        document.querySelector(
            ".valiass-nav"
        );


    const mobileNavClose =
        document.querySelector(
            ".mobile-nav-close"
        );


    /* =====================================================
       OPEN / CLOSE MAIN MOBILE MENU
       ===================================================== */

    function closeMobileMenu(){

        mobileNav.classList.remove(
            "mobile-open"
        );

        mobileMenuButton.classList.remove(
            "open"
        );

        mobileMenuButton.setAttribute(
            "aria-expanded",
            "false"
        );

        mobileMenuButton.setAttribute(
            "aria-label",
            "Open navigation"
        );


        branchesMenu.classList.remove(
            "open"
        );

        branchesTrigger.setAttribute(
            "aria-expanded",
            "false"
        );

    }


    function openMobileMenu(){

        mobileNav.classList.add(
            "mobile-open"
        );

        mobileMenuButton.classList.add(
            "open"
        );

        mobileMenuButton.setAttribute(
            "aria-expanded",
            "true"
        );

        mobileMenuButton.setAttribute(
            "aria-label",
            "Close navigation"
        );

    }


    mobileMenuButton.addEventListener(
        "click",
        function(event){

            event.stopPropagation();

            const isOpen =
                mobileNav.classList.contains(
                    "mobile-open"
                );


            if(isOpen){

                closeMobileMenu();

            }else{

                openMobileMenu();

            }

        }
    );


    /* =====================================================
       HIDE / CLOSE BUTTON
       ===================================================== */

    mobileNavClose.addEventListener(
        "click",
        function(){

            closeMobileMenu();

        }
    );


    /* =====================================================
       MOBILE BRANCHES TOGGLE
       ===================================================== */

    branchesTrigger.addEventListener(
        "click",
        function(event){

            if(
                window.innerWidth <= 800
            ){

                event.preventDefault();

                event.stopPropagation();


                const isOpen =
                    branchesMenu.classList.contains(
                        "open"
                    );


                branchesMenu.classList.toggle(
                    "open",
                    !isOpen
                );


                branchesTrigger.setAttribute(
                    "aria-expanded",
                    String(!isOpen)
                );

            }

        }
    );


    /* =====================================================
       CLOSE MOBILE MENU WHEN LINK IS SELECTED
       ===================================================== */

    const mobilePageLinks =
        document.querySelectorAll(
            ".valiass-nav > a:not([data-page='index.html']), " +
            ".branch-menu-overview, " +
            "a.branch-menu-item"
        );


    mobilePageLinks.forEach(
        function(link){

            link.addEventListener(
                "click",
                function(){

                    if(
                        window.innerWidth <= 800
                    ){

                        closeMobileMenu();

                    }

                }
            );

        }
    );


    /* =====================================================
       CLOSE WHEN CLICKING OUTSIDE
       ===================================================== */

    document.addEventListener(
        "click",
        function(event){

            if(
                window.innerWidth <= 800 &&
                mobileNav.classList.contains(
                    "mobile-open"
                ) &&
                !mobileNav.contains(
                    event.target
                ) &&
                !mobileMenuButton.contains(
                    event.target
                )
            ){

                closeMobileMenu();

            }

        }
    );


    /* =====================================================
       RESET MOBILE STATE WHEN RETURNING TO DESKTOP
       ===================================================== */

    window.addEventListener(
        "resize",
        function(){

            if(
                window.innerWidth > 800
            ){

                closeMobileMenu();

            }

        }
    );


})();

</script>
