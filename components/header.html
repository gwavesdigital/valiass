   DESKTOP NAV

.nav-dropdown-button {

  text-decoration: none;

  background: none;
  border: none;

  cursor: pointer;

  padding: 8px 0;

  transition: color 0.25s ease;
}

.nav-link:hover,
.nav-dropdown-button:hover {
  color: #d0b46b;
}


/* ACTIVE LINK */

.nav-link.active {
  color: #d0b46b;
}

.nav-link.active::after {
  content: "";

  position: absolute;

  left: 0;
  right: 0;

  height: 1px;

/* =========================================
   BRANCHES DROPDOWN

.nav-dropdown {

.dropdown-arrow {
  margin-left: 5px;

/* DESKTOP DROPDOWN */

.nav-dropdown-menu {
  position: absolute;

  top: calc(100% + 16px);
  right: -20px;

  min-width: 220px;

  padding: 10px 0;

  background: rgba(14, 25, 19, 0.98);

  border: 1px solid rgba(208, 180, 107, 0.25);

  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);

  opacity: 0;
  visibility: hidden;

  transform: translateY(-8px);

  transition:
    opacity 0.25s ease,
    visibility 0.25s ease,
    transform 0.25s ease;
}

.nav-dropdown:hover .nav-dropdown-menu {
  opacity: 1;
  visibility: visible;

  transform: translateY(0);
}

.nav-dropdown-menu a {
  display: block;

  padding: 12px 20px;

  color: #f5f0e4;

  font-family: Georgia, "Times New Roman", serif;

  font-size: 14px;

    background 0.2s ease,

  /* HAMBURGER → X */

  }

  .mobile-menu-button.open span:nth-child(2) {

  }

  .mobile-menu-button.open span:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
  }


  /* =====================================
     MOBILE NAV PANEL
     ===================================== */

  .valiass-nav {
    position: fixed;

    top: 70px;
    left: 0;

    width: 100%;

    height: calc(100vh - 70px);

    display: flex;

    flex-direction: column;

    align-items: stretch;

    gap: 0;

    padding: 0;

    box-sizing: border-box;

    overflow-y: auto;

    background: rgba(14, 25, 19, 0.99);

  /* OPEN MENU */

/* =========================================
   SMALL MOBILE
   ========================================= */

@media (max-width: 480px) {

  .valiass-header-inner {

</style>


<script>

(function () {

  function initValiassHeader() {

    const menuButton =
      document.getElementById("mobileMenuButton");

    const nav =
      document.getElementById("valiassNav");

    const closeButton =
      document.getElementById("mobileNavClose");

    const branchesButton =
      document.getElementById("branchesButton");

    const branchesMenu =
      document.querySelector(".nav-dropdown-menu");

    if (!menuButton || !nav) {
      return;
    }


    /* ===============================
       OPEN / CLOSE MOBILE MENU
       =============================== */

    function openMobileMenu() {

      nav.classList.add("mobile-open");

      menuButton.classList.add("open");

      menuButton.setAttribute(
        "aria-label",
        "Close menu"
      );

      document.body.style.overflow = "hidden";
    }


    function closeMobileMenu() {

      nav.classList.remove("mobile-open");

      menuButton.classList.remove("open");

      menuButton.setAttribute(
        "aria-label",
        "Open menu"
      );

      document.body.style.overflow = "";

      if (branchesMenu) {
        branchesMenu.classList.remove("mobile-open");
      }

      if (branchesButton) {
        branchesButton.classList.remove("open");
      }
    }


    /* ===============================
       HAMBURGER
       =============================== */

    menuButton.addEventListener(
      "click",
      function (event) {

        event.preventDefault();
        event.stopPropagation();

        if (nav.classList.contains("mobile-open")) {
          closeMobileMenu();
        } else {
          openMobileMenu();
        }

      }
    );


    /* ===============================
       CLOSE BUTTON
       =============================== */

    if (closeButton) {

      closeButton.addEventListener(
        "click",
        function () {
          closeMobileMenu();
        }
      );

    }


    /* ===============================
       BRANCHES
       =============================== */

    if (branchesButton && branchesMenu) {

      branchesButton.addEventListener(
        "click",
        function (event) {

          event.preventDefault();
          event.stopPropagation();

          branchesButton.classList.toggle("open");

          branchesMenu.classList.toggle(
            "mobile-open"
          );

        }
      );

    }


    /* ===============================
       CLOSE AFTER NAVIGATION
       =============================== */

    const navLinks =
      nav.querySelectorAll(
        "a:not(.nav-dropdown-menu a)"
      );

    navLinks.forEach(function (link) {

      link.addEventListener(
        "click",
        function () {

          closeMobileMenu();

        }
      );

    });


    /* ===============================
       CLOSE WHEN CLICKING OUTSIDE
       =============================== */

    document.addEventListener(
      "click",
      function (event) {

        if (
          nav.classList.contains("mobile-open") &&
          !nav.contains(event.target) &&
          !menuButton.contains(event.target)
        ) {

          closeMobileMenu();

        }

      }
    );


    /* ===============================
       RESET WHEN BACK TO DESKTOP
       =============================== */

    window.addEventListener(
      "resize",
      function () {

        if (window.innerWidth > 800) {
          closeMobileMenu();
        }

      }
    );

  }


  /* HEADER MAY BE LOADED DYNAMICALLY */

  if (document.readyState === "loading") {

    document.addEventListener(
      "DOMContentLoaded",
      initValiassHeader
    );

  } else {

    initValiassHeader();

  }

})();

</script>
